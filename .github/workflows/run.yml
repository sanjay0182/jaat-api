name: run
on: workflow_dispatch
permissions:
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: runner chalao (saath me purane runs saaf)
        env:
          WORKER: ${{ secrets.WORKER }}
          RUNNER_SECRET: ${{ secrets.RUNNER_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # repo Variable (Settings -> Variables): DUCK_HEADED=1 ho to chrome xvfb me headed chalega
          DUCK_HEADED: ${{ vars.DUCK_HEADED }}
          # agla runner 90s par start (pehle 120s): naye runner ko 3+3+3 pages tayyar karne ka time mile, overlap lamba
          NEXT_AT_MS: 90000
          # naya runner 15s me apne 3+3+3 pages tayyar kare, tab hi requests le
          WARM_WAIT_MS: 15000
          # Private provider keys only GitHub Secrets se aayengi; source me koi live key nahi rakhi.
          REV_KEY: ${{ secrets.REV_KEY }}
          REV_GROK_KEY: ${{ secrets.REV_GROK_KEY }}
          REV_PRO_KEY: ${{ secrets.REV_PRO_KEY }}
          REV_LUNA_KEY: ${{ secrets.REV_LUNA_KEY }}
          DAI_KEY: ${{ secrets.DAI_KEY }}
          GEM_KEY: ${{ secrets.GEM_KEY }}
          GEM2_KEY: ${{ secrets.GEM2_KEY }}
          # Secret values are deliberately not stored in source.
        run: |
          # peeche background me: sabse naye 10 chhodkar baaki poore ho chuke runs delete
          ( gh api "repos/${{ github.repository }}/actions/runs?status=completed&per_page=100" \
              --jq '.workflow_runs[10:][].id' \
            | xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/runs/{}" ) >/dev/null 2>&1 &
          # playwright-core peeche install (sirf duck request ke liye chahiye; jaat par asar nahi)
          ( npm i --no-audit --no-fund --no-save playwright-core >/dev/null 2>&1 ) &
          if [ "$DUCK_HEADED" = "1" ]; then xvfb-run -a node runner.js; else node runner.js; fi
      - name: debug files (screenshot) upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
